<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>KaedeSystem</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <span class="app">KaedeSystem</span>
  <span id="conn" class="conn"><span class="dot"></span><span id="connText">未接続</span></span>
</header>
<div id="banner" class="banner" hidden></div>
<main id="view"></main>
<div id="demo" class="demo" hidden></div>
<div id="toast" class="toast" hidden></div>
<dialog id="ask">
  <form method="dialog">
    <p id="askText"></p>
    <div class="askBtns">
      <button value="no" class="btn sub">やめる</button>
      <button value="yes" class="btn go" id="askYes">進める</button>
    </div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
